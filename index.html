<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Hub: AI & Files</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src='https://meet.jit.si/external_api.js'></script>
    <style>
        :root { --primary: #5865F2; --bg-dark: #202225; --bg-mid: #2f3136; --bg-light: #36393f; --text: #dcddde; --accent: #3ba55c; --danger: #ed4245; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #202225; border-radius: 4px; }

        /* LOGIN */
        #login-screen { position: absolute; top:0; left:0; width:100%; height:100%; background: var(--bg-mid); display: flex; justify-content: center; align-items: center; z-index: 999; }
        .card { background: var(--bg-light); padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; }

        /* LAYOUT */
        #app-layout { display: none; width: 100%; height: 100%; }

        /* 1. SERVER SIDEBAR */
        .server-bar { width: 72px; background: var(--bg-dark); display: flex; flex-direction: column; align-items: center; padding-top: 15px; overflow-y: auto; gap: 10px; }
        .icon-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--bg-light); cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; font-size: 20px; overflow: hidden; position: relative; }
        .icon-btn:hover, .icon-btn.active { border-radius: 15px; background: var(--primary); color: white; }
        .icon-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* 2. SUB-SIDEBAR */
        .sub-sidebar { width: 240px; background: var(--bg-mid); display: flex; flex-direction: column; border-right: 1px solid #202225; }
        .sub-header { padding: 15px; border-bottom: 1px solid #202225; font-weight: bold; font-size: 16px; display: flex; justify-content: space-between; }
        .sub-list { flex: 1; padding: 10px; overflow-y: auto; }
        .nav-item { padding: 8px 10px; border-radius: 4px; cursor: pointer; color: #8e9297; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; }
        .nav-item:hover, .nav-item.active { background: var(--bg-light); color: var(--text); }
        .user-panel { background: #292b2f; padding: 10px; display: flex; align-items: center; gap: 10px; }
        
        /* 3. MAIN CONTENT */
        .main-stage { flex: 1; background: var(--bg-light); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        
        /* CHAT UI */
        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; gap: 15px; animation: fadeIn 0.2s; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background: #555; cursor: pointer; }
        .msg-content h4 { margin: 0 0 5px 0; font-size: 14px; color: white; }
        .msg-content span { font-size: 11px; color: #72767d; font-weight: normal; margin-left: 5px; }
        .msg-text { color: #dcddde; line-height: 1.4; }
        .msg-media { max-width: 250px; border-radius: 8px; margin-top: 5px; cursor: pointer; }
        .ai-msg { border-left: 3px solid #00d2ff; padding-left: 10px; background: rgba(0, 210, 255, 0.05); border-radius: 4px; }
        
        /* INPUT AREA */
        .input-area { padding: 20px; background: var(--bg-light); margin-bottom: 10px; display: flex; gap: 10px; align-items: center; }
        .chat-input { width: 100%; background: #40444b; border: none; padding: 15px; border-radius: 8px; color: white; outline: none; }
        .action-btn { width: 45px; height: 45px; border-radius: 8px; border: none; background: #40444b; color: #b9bbbe; cursor: pointer; font-size: 18px; transition: 0.2s; display: flex; justify-content: center; align-items: center;}
        .action-btn:hover { color: white; background: var(--primary); }
        .action-btn.listening { color: white; background: var(--danger); animation: pulse 1s infinite; }
        
        /* GAMES UI */
        .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .game-card { background: var(--bg-dark); padding: 20px; border-radius: 10px; text-align: center; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .game-card:hover { border-color: var(--primary); transform: translateY(-5px); }
        
        /* PACKIAN UI */
        .card-display { width: 120px; height: 170px; border-radius: 10px; display: inline-flex; flex-direction: column; justify-content: center; align-items: center; margin: 10px; position: relative; border: 4px solid #202225; box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .card-display:hover { transform: scale(1.1); z-index: 10; }
        .card-rarity { position: absolute; top: 5px; right: 5px; width: 15px; height: 15px; border-radius: 50%; border: 2px solid white; }
        
        /* UTILS */
        .hidden { display: none !important; }
        .btn { padding: 8px 16px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; color: white; background: var(--primary); }
        .btn-green { background: var(--accent); }
        .btn-red { background: var(--danger); }
        input[type="text"], input[type="number"] { background: #202225; border: 1px solid #202225; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="card">
            <h1>🎮 Social Arcade & AI</h1>
            <p>Chat, Blog, Play, Collect.</p>
            <button class="btn btn-green" id="google-login">Sign in with Google</button>
        </div>
    </div>

    <div id="app-layout">
        
        <div class="server-bar">
            <div class="icon-btn active" id="nav-home" onclick="navTo('home')" title="Social Hub">
                <i class="fas fa-home"></i>
            </div>
            <div class="icon-btn" id="nav-games" onclick="navTo('games')" title="Arcade & Packian">
                <i class="fas fa-gamepad"></i>
            </div>
            <hr style="width: 50%; border: 1px solid #40444b;">
            <div id="server-list-container" style="display:flex; flex-direction:column; gap:10px; width:100%; align-items:center;"></div>
            <div class="icon-btn" style="background: var(--accent); color: white;" onclick="createNewServer()">
                <i class="fas fa-plus"></i>
            </div>
        </div>

        <div class="sub-sidebar">
            <div class="sub-header">
                <span id="sidebar-title">Social Hub</span>
                <i class="fas fa-plus" id="add-channel-btn" style="cursor:pointer; display:none;" onclick="addChannel()"></i>
            </div>
            
            <div class="sub-list" id="sidebar-list">
                </div>

            <div class="user-panel">
                <img id="my-avatar" src="" class="msg-avatar" onclick="editProfile()">
                <div style="flex: 1; overflow: hidden;">
                    <div id="my-name" style="font-weight: bold; font-size: 14px; white-space: nowrap;">Loading...</div>
                    <div id="my-coins" style="font-size: 11px; color: gold;">Coins: 0</div>
                </div>
                <i class="fas fa-cog" style="cursor: pointer; color: #b9bbbe;" onclick="editProfile()"></i>
            </div>
        </div>

        <div class="main-stage" id="main-content">
            <div style="padding: 15px; border-bottom: 1px solid #202225; display: flex; justify-content: space-between; align-items: center; background: var(--bg-light);">
                <h3 id="content-title" style="margin:0;"><i class="fas fa-hashtag"></i> global-feed</h3>
                <div id="header-actions">
                    <button class="btn btn-green" onclick="toggleVideo()" id="video-btn" style="display:none;"><i class="fas fa-video"></i> Call</button>
                </div>
            </div>

            <div id="video-frame" style="height:0; transition: height 0.3s; overflow:hidden; background:black;"></div>

            <div id="scroll-area" class="chat-area"></div>

            <div id="input-area" class="input-area">
                <input type="file" id="file-input" hidden onchange="uploadFile(this)">
                <button class="action-btn" onclick="document.getElementById('file-input').click()" title="Upload File">
                    <i class="fas fa-paperclip"></i>
                </button>
                
                <button class="action-btn" id="ai-mic-btn" onclick="toggleVoiceInput()" title="Talk to AI">
                    <i class="fas fa-microphone"></i>
                </button>
                
                <input type="text" class="chat-input" id="message-input" placeholder="Type a message or talk to AI...">
            </div>
        </div>
    </div>

    <div id="profile-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; justify-content:center; align-items:center;">
        <div class="card" style="width: 300px; text-align: left;">
            <h3>Edit Profile</h3>
            <label>Display Name</label>
            <input type="text" id="edit-name" style="margin-bottom: 10px;">
            <label>Avatar URL</label>
            <input type="text" id="edit-pic" style="margin-bottom: 10px;">
            <button class="btn" onclick="saveProfile()">Save</button>
            <button class="btn btn-red" onclick="document.getElementById('profile-modal').style.display='none'">Cancel</button>
        </div>
    </div>

    <script type="module">
        // Import Storage and Auth/Firestore
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, addDoc, getDoc, updateDoc, arrayUnion, arrayRemove, onSnapshot, query, where, orderBy, serverTimestamp, getDocs, increment, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        // --- TODO: PASTE FIREBASE CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAhXmz78lZyyiEO0q1y55xZP6fYrrXiEP0",
            authDomain: "arseck.firebaseapp.com",
            projectId: "arseck",
            storageBucket: "arseck.firebasestorage.app", // Ensure this matches console exactly
            messagingSenderId: "48055621631",
            appId: "1:48055621631:web:402bb61adf52155a90b9ca"
        };

        // --- AI API KEYS (Rotation) ---
        const GROQ_KEYS = [ gsk_KEY_1, gsk_KEY_2, gsk_KEY_3 ];
        const ELEVEN_KEYS = [ xi_KEY_1, xi_KEY_2 ];

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);
        const ADMIN_EMAIL = "popuppy106@gmail.com";

        let currentUser = null;
        let activeContext = 'home'; 
        let activeSubContext = 'global-feed';
        let activeCollectionPath = "global_posts"; // default
        let jitsiApi = null;
        
        // Voice Variables
        let recognition = null;
        let isListening = false;
        let isAiMode = false;

        // --- AUTH ---
        document.getElementById('google-login').onclick = () => signInWithPopup(auth, new GoogleAuthProvider());

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('app-layout').style.display = 'flex';
                
                const userRef = doc(db, "users", user.uid);
                const snap = await getDoc(userRef);
                if (!snap.exists()) {
                    await setDoc(userRef, {
                        uid: user.uid, email: user.email, displayName: user.displayName, 
                        photoURL: user.photoURL, coins: 100, inventory: [], friends: []
                    });
                }
                updateUserUI();
                loadServers();
                initSpeechRecognition();
                navTo('home'); 
            }
        });

        function updateUserUI() {
            document.getElementById('my-avatar').src = currentUser.photoURL;
            document.getElementById('my-name').innerText = currentUser.displayName;
            onSnapshot(doc(db, "users", currentUser.uid), (doc) => {
                document.getElementById('my-coins').innerText = `Coins: ${doc.data().coins || 0}`;
            });
        }

        // --- FILE UPLOAD LOGIC (FIXED) ---
        window.uploadFile = async (inputElement) => {
            const file = inputElement.files[0];
            if (!file) return;

            // Determine type
            let type = 'file';
            if (file.type.startsWith('image/')) type = 'image';
            if (file.type.startsWith('video/')) type = 'video';

            // Show a temporary "Uploading..." alert or UI indicator
            alert("Uploading " + file.name + "...");

            try {
                // 1. Upload to Storage
                // Path: uploads/UID/TIMESTAMP_FILENAME
                const storageRef = sRef(storage, `uploads/${currentUser.uid}/${Date.now()}_${file.name}`);
                await uploadBytes(storageRef, file);
                
                // 2. Get URL
                const downloadURL = await getDownloadURL(storageRef);

                // 3. Send Message to Firestore
                if (activeSubContext === 'ai-companion') {
                    alert("Cannot send files to AI.");
                    return;
                }
                
                await addDoc(collection(db, activeCollectionPath), {
                    text: "", // Empty text for file message
                    fileUrl: downloadURL,
                    fileType: type,
                    author: currentUser.displayName,
                    photo: currentUser.photoURL,
                    timestamp: serverTimestamp(),
                    uid: currentUser.uid
                });
                
                alert("Upload Complete!");
                
            } catch (error) {
                console.error("Upload failed", error);
                alert("Upload failed! Check Console. (Did you enable Storage Rules?)");
            }
            
            // Reset input so you can upload same file again if needed
            inputElement.value = '';
        };

        // --- AI & VOICE LOGIC ---
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = () => { document.getElementById('ai-mic-btn').classList.add('listening'); };
                recognition.onend = () => { 
                    document.getElementById('ai-mic-btn').classList.remove('listening'); 
                    isListening = false; 
                };
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('message-input').value = transcript;
                    if(isAiMode) handleAiConversation(transcript);
                };
            }
        }

        window.toggleVoiceInput = () => {
            if (isListening) {
                recognition.stop();
            } else {
                if(activeSubContext === 'ai-companion') isAiMode = true;
                else isAiMode = false;
                recognition.start();
                isListening = true;
            }
        };

        async function askGroq(prompt) {
            for (let i = 0; i < GROQ_KEYS.length; i++) {
                try {
                    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                        method: "POST",
                        headers: { "Authorization": `Bearer ${GROQ_KEYS[i]}`, "Content-Type": "application/json" },
                        body: JSON.stringify({ messages: [{ role: "user", content: prompt }], model: "llama-3.3-70b-versatile" })
                    });
                    if (!response.ok) throw new Error("Groq API Error");
                    const data = await response.json();
                    return data.choices[0].message.content;
                } catch (e) { console.warn(`Groq Key ${i} failed.`); }
            }
            reportErrorToAdmin("All Groq API Keys Failed.");
            return "Error: AI services are currently unavailable.";
        }

        async function speakElevenLabs(text) {
            if(text.startsWith("Error:")) { window.speechSynthesis.speak(new SpeechSynthesisUtterance("Connection error.")); return; }
            for (let i = 0; i < ELEVEN_KEYS.length; i++) {
                try {
                    const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/21m00Tcm4TlvDq8ikWAM`, {
                        method: "POST",
                        headers: { "xi-api-key": ELEVEN_KEYS[i], "Content-Type": "application/json" },
                        body: JSON.stringify({ text: text, model_id: "eleven_monolingual_v1" })
                    });
                    if (!response.ok) throw new Error("ElevenLabs API Error");
                    const blob = await response.blob();
                    new Audio(URL.createObjectURL(blob)).play();
                    return;
                } catch (e) { console.warn(`ElevenLabs Key ${i} failed.`); }
            }
            reportErrorToAdmin("All ElevenLabs Keys Failed.");
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        }

        async function reportErrorToAdmin(msg) {
            const q = query(collection(db, "users"), where("email", "==", ADMIN_EMAIL));
            const snap = await getDocs(q);
            if(!snap.empty) {
                const adminUid = snap.docs[0].id;
                // Just creating a log entry in a system chat
                // Implementation simplified for brevity
                console.error("ADMIN REPORT:", msg);
            }
        }

        async function handleAiConversation(userText) {
            const area = document.getElementById('scroll-area');
            area.innerHTML += `
                <div class="msg" style="justify-content: flex-end;">
                    <div class="msg-content" style="text-align:right;">
                        <h4>You</h4><div class="msg-text">${userText}</div>
                    </div>
                </div>`;
            const aiText = await askGroq(userText);
            area.innerHTML += `
                <div class="msg">
                    <div class="msg-avatar" style="background: #00d2ff; display:flex; justify-content:center; align-items:center;"><i class="fas fa-robot"></i></div>
                    <div class="msg-content ai-msg"><h4>AI Companion</h4><div class="msg-text">${aiText}</div></div>
                </div>`;
            area.scrollTop = area.scrollHeight;
            speakElevenLabs(aiText);
            document.getElementById('message-input').value = "";
        }

        // --- NAVIGATION & CHAT RENDERER ---
        window.navTo = (context, serverData = null) => {
            activeContext = context;
            document.querySelectorAll('.icon-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('video-btn').style.display = 'none';
            document.getElementById('video-frame').style.height = '0';
            const list = document.getElementById('sidebar-list');
            list.innerHTML = "";

            if (context === 'home') {
                document.getElementById('nav-home').classList.add('active');
                document.getElementById('sidebar-title').innerText = "Social Hub";
                document.getElementById('add-channel-btn').style.display = 'none';
                
                renderNavItem(list, "Global Feed", "fas fa-globe", () => loadFeed('global'), true);
                renderNavItem(list, "AI Companion", "fas fa-robot", () => loadAiChat());
                renderNavItem(list, "Friends", "fas fa-user-friends", () => loadFriends());
                loadFeed('global');
            } 
            else if (context === 'games') {
                document.getElementById('nav-games').classList.add('active');
                document.getElementById('sidebar-title').innerText = "Arcade";
                document.getElementById('add-channel-btn').style.display = 'none';
                renderNavItem(list, "Game Menu", "fas fa-gamepad", () => loadGameMenu(), true);
                renderNavItem(list, "Packian Store", "fas fa-store", () => loadPackianStore());
                renderNavItem(list, "My Collection", "fas fa-layer-group", () => loadCollection());
                if(currentUser.email === ADMIN_EMAIL) renderNavItem(list, "Admin Panel", "fas fa-crown", () => loadAdminPanel());
                loadGameMenu();
            } 
            else if (serverData) {
                document.getElementById(`server-${serverData.id}`).classList.add('active');
                document.getElementById('sidebar-title').innerText = serverData.name;
                document.getElementById('add-channel-btn').style.display = 'block';
                document.getElementById('add-channel-btn').onclick = () => createChannel(serverData.id);
                
                onSnapshot(collection(db, `servers/${serverData.id}/channels`), (snap) => {
                    list.innerHTML = "";
                    let first = true;
                    snap.forEach(d => {
                        const ch = d.data();
                        renderNavItem(list, ch.name, "fas fa-hashtag", () => loadChannel(serverData.id, d.id, ch.name), first);
                        if(first) { loadChannel(serverData.id, d.id, ch.name); first = false; }
                    });
                });
            }
        };

        function renderNavItem(container, name, icon, onClick, active = false) {
            const div = document.createElement('div');
            div.className = `nav-item ${active ? 'active' : ''}`;
            div.innerHTML = `<i class="${icon}"></i> ${name}`;
            div.onclick = () => {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                div.classList.add('active');
                onClick();
            };
            container.appendChild(div);
        }

        // --- VIEW LOADERS ---
        function loadAiChat() {
            activeSubContext = 'ai-companion';
            document.getElementById('content-title').innerHTML = `<i class="fas fa-robot"></i> AI Companion`;
            document.getElementById('input-area').style.display = 'flex';
            document.getElementById('scroll-area').innerHTML = `
                <div style="text-align:center; margin-top:50px; color:#72767d;">
                    <i class="fas fa-robot fa-3x"></i><h2>Talk to me!</h2><p>Click mic to speak.</p>
                </div>`;
            const input = document.getElementById('message-input');
            input.onkeypress = async (e) => {
                if(e.key === 'Enter' && input.value.trim()) handleAiConversation(input.value);
            };
        }

        function loadFeed(type) {
            activeSubContext = 'global-feed';
            activeCollectionPath = "global_posts";
            document.getElementById('content-title').innerHTML = `<i class="fas fa-globe"></i> Global Feed`;
            document.getElementById('input-area').style.display = 'flex';
            const q = query(collection(db, "global_posts"), orderBy("timestamp", "asc"));
            setupChatListener(q, "global_posts");
        }

        function loadChannel(serverId, channelId, name) {
            activeContext = serverId;
            activeSubContext = channelId;
            activeCollectionPath = `servers/${serverId}/channels/${channelId}/messages`;
            document.getElementById('content-title').innerHTML = `<i class="fas fa-hashtag"></i> ${name}`;
            document.getElementById('input-area').style.display = 'flex';
            document.getElementById('video-btn').style.display = 'inline-block';
            const q = query(collection(db, activeCollectionPath), orderBy("timestamp", "asc"));
            setupChatListener(q, activeCollectionPath);
        }

        function setupChatListener(queryRef, collectionPath) {
            const area = document.getElementById('scroll-area');
            onSnapshot(queryRef, (snap) => {
                area.innerHTML = "";
                snap.forEach(d => {
                    const m = d.data();
                    let mediaHtml = "";
                    if(m.fileType === 'image') mediaHtml = `<img src="${m.fileUrl}" class="msg-media" onclick="window.open(this.src)">`;
                    if(m.fileType === 'video') mediaHtml = `<video src="${m.fileUrl}" class="msg-media" controls></video>`;

                    area.innerHTML += `
                        <div class="msg">
                            <img src="${m.photo}" class="msg-avatar">
                            <div class="msg-content">
                                <h4>${m.author} <span>${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString() : ''}</span></h4>
                                <div class="msg-text">${m.text}</div>
                                ${mediaHtml}
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });

            const input = document.getElementById('message-input');
            input.onkeypress = async (e) => {
                if(e.key === 'Enter' && input.value.trim()) {
                    if(activeSubContext === 'ai-companion') handleAiConversation(input.value);
                    else {
                        await addDoc(collection(db, collectionPath), {
                            text: input.value,
                            author: currentUser.displayName,
                            photo: currentUser.photoURL,
                            timestamp: serverTimestamp(),
                            uid: currentUser.uid
                        });
                        input.value = "";
                    }
                }
            };
        }
        
        // --- FRIENDS & EXTRAS ---
        function loadFriends() {
             document.getElementById('content-title').innerText = "Friends";
             document.getElementById('input-area').style.display = 'none';
             document.getElementById('scroll-area').innerHTML = `<div style="padding:20px;"><h3>Friends List</h3><input id="f-email" placeholder="Email"><button class="btn" onclick="addF()">Add</button></div>`;
        }
        window.addF = async () => {
             const email = document.getElementById('f-email').value;
             // Basic logic
             await updateDoc(doc(db, "users", currentUser.uid), { friends: arrayUnion(email) });
             alert("Friend added (basic mode)");
        }

        // --- SERVER CREATION ---
        window.createNewServer = async () => {
            const name = prompt("Server Name:");
            const icon = prompt("Icon URL:") || `https://ui-avatars.com/api/?name=${name}&background=random`;
            if(!name) return;
            const ref = await addDoc(collection(db, "servers"), { name, icon, owner: currentUser.uid, members: [currentUser.uid] });
            await addDoc(collection(db, `servers/${ref.id}/channels`), { name: "general", type: "text" });
        };
        window.createChannel = async (serverId) => {
            const name = prompt("Channel Name:");
            if(name) await addDoc(collection(db, `servers/${serverId}/channels`), { name, type: "text" });
        }
        function loadServers() {
            const q = query(collection(db, "servers"), where("members", "array-contains", currentUser.uid));
            onSnapshot(q, (snap) => {
                const cont = document.getElementById('server-list-container');
                cont.innerHTML = "";
                snap.forEach(d => {
                    const data = d.data();
                    const div = document.createElement('div');
                    div.className = "icon-btn";
                    div.id = `server-${d.id}`;
                    div.innerHTML = `<img src="${data.icon}">`;
                    div.onclick = () => navTo('server', { id: d.id, name: data.name });
                    cont.appendChild(div);
                });
            });
        }

        // --- VIDEO ---
        window.toggleVideo = () => {
            const frame = document.getElementById('video-frame');
            if(frame.style.height === '0px' || frame.style.height === '') {
                frame.style.height = '400px';
                const options = { roomName: `SocialArcade_${activeSubContext}`, width: '100%', height: 400, parentNode: frame, userInfo: { displayName: currentUser.displayName } };
                jitsiApi = new JitsiMeetExternalAPI('meet.jit.si', options);
            } else {
                frame.style.height = '0';
                if(jitsiApi) jitsiApi.dispose();
            }
        };

        // --- GAMES & PACKIAN ---
        function loadGameMenu() {
            document.getElementById('content-title').innerText = "Arcade";
            const area = document.getElementById('scroll-area');
            area.innerHTML = `
                <div class="game-grid">
                    <div class="game-card" onclick="playGame('clicker')"><i class="fas fa-mouse fa-3x" style="color:#f1c40f"></i><h3>Coin Clicker</h3></div>
                    <div class="game-card" onclick="playGame('slots')"><i class="fas fa-dice fa-3x" style="color:#e67e22"></i><h3>Slots</h3></div>
                    <div class="game-card" onclick="playGame('rps')"><i class="fas fa-hand-scissors fa-3x" style="color:#3498db"></i><h3>RPS</h3></div>
                </div>
                <div id="game-stage" style="padding:20px; text-align:center;"></div>`;
        }
        window.playGame = (game) => {
            const stage = document.getElementById('game-stage');
            stage.innerHTML = `<h2>Playing: ${game}</h2><button class="btn btn-red" onclick="loadGameMenu()">Exit</button><br><br>`;
            const userRef = doc(db, "users", currentUser.uid);
            if(game==='clicker') {
                stage.innerHTML += `<button class="btn btn-green" onclick="window.clickCoin()">MINE COIN (+1)</button>`;
                window.clickCoin = () => updateDoc(userRef, { coins: increment(1) });
            }
        }
        function loadPackianStore() {
            document.getElementById('content-title').innerText = "Packian Store";
            const area = document.getElementById('scroll-area');
            area.innerHTML = `<div id="pack-list" style="padding:20px; display:flex; gap:20px;"></div>`;
            onSnapshot(collection(db, "packian_packs"), (snap) => {
                const list = document.getElementById('pack-list');
                list.innerHTML = "";
                snap.forEach(d => {
                    const p = d.data();
                    list.innerHTML += `<div class="card" style="width:150px;"><h4>${p.name}</h4><p>${p.price} Coins</p><button class="btn" onclick="buyPack('${d.id}', ${p.price})">Buy</button></div>`;
                });
            });
        }
        window.buyPack = async (packId, price) => {
            const userRef = doc(db, "users", currentUser.uid);
            const userSnap = await getDoc(userRef);
            if(userSnap.data().coins < price) return alert("Not enough coins!");
            await updateDoc(userRef, { coins: increment(-price) });
            const cardsSnap = await getDocs(collection(db, "packian_cards"));
            const cards = []; cardsSnap.forEach(d => cards.push(d.data()));
            if(cards.length === 0) return alert("No cards!");
            const wonCard = cards[Math.floor(Math.random() * cards.length)];
            await updateDoc(userRef, { inventory: arrayUnion(wonCard) });
            alert(`Won: ${wonCard.name}!`);
        }
        function loadCollection() {
            document.getElementById('content-title').innerText = "Collection";
            document.getElementById('scroll-area').innerHTML = `<div id="my-grid" style="padding:20px;"></div>`;
            onSnapshot(doc(db, "users", currentUser.uid), (d) => {
                const grid = document.getElementById('my-grid');
                grid.innerHTML = "";
                (d.data().inventory || []).forEach(c => {
                    grid.innerHTML += `<div class="card-display" style="background:${c.hex}"><span style="background:rgba(0,0,0,0.5);color:white;">${c.name}</span></div>`;
                });
            });
        }
        function loadAdminPanel() {
            document.getElementById('scroll-area').innerHTML = `<div style="padding:20px;"><h3>Create Card</h3><input id="c-name" placeholder="Name"><input id="c-hex" type="color"><button class="btn" onclick="admCC()">Create</button><h3>Create Pack</h3><input id="p-name" placeholder="Name"><input id="p-price" type="number" placeholder="Price"><button class="btn" onclick="admCP()">Create</button></div>`;
        }
        window.admCC = async () => addDoc(collection(db, "packian_cards"), { name:document.getElementById('c-name').value, hex:document.getElementById('c-hex').value, rarity:'Common'});
        window.admCP = async () => addDoc(collection(db, "packian_packs"), { name:document.getElementById('p-name').value, price:Number(document.getElementById('p-price').value)});

        // --- PROFILE ---
        window.editProfile = () => document.getElementById('profile-modal').style.display='flex';
        window.saveProfile = async () => {
            const name=document.getElementById('edit-name').value, pic=document.getElementById('edit-pic').value;
            await updateProfile(currentUser, {displayName:name, photoURL:pic});
            await updateDoc(doc(db,"users",currentUser.uid),{displayName:name, photoURL:pic});
            document.getElementById('profile-modal').style.display='none';
        }

    </script>
</body>
</html>
